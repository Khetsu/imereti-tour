<!doctype html>
<!-- იმერეთი ტური · 404: გვერდი ვერ მოიძებნა (Cloudflare Pages ამ ფაილს აჩვენებს 404 კოდით ყველა არარსებულ მისამართზე) -->
<html lang="ka">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <script>
      // Facebook ზოგჯერ ლინკს ბოლოში ემოჯის (📞 👉) ან ტექსტს უერთებს: /bus/batumi-moscow/📞 → /bus/batumi-moscow/
      (function () {
        var p; try { p = decodeURIComponent(location.pathname); } catch (e) { p = location.pathname; }
        var c = p.replace(/[^\x00-\x7F][\s\S]*$/, "").replace(/[^\/]*$/, "");
        if (/[^\x00-\x7F]/.test(p) && c && c !== p) location.replace(c + location.search + location.hash);
      })();
    </script>
    <title>გვერდი ვერ მოიძებნა — იმერეთი ტური</title>
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/fx.css">
    <style>
      body{min-height:100vh;min-height:100svh;display:grid;place-items:center;background:var(--navy3,#0e1730);color:var(--cream,#f6f1e7);text-align:center;padding:24px}
      .nf b{display:block;font:900 clamp(80px,22vw,160px)/1 var(--display,var(--font));color:var(--coral,#ff6b5b)}
      .nf h1{margin:8px 0 6px;font-size:clamp(22px,5vw,32px)}
      .nf p{margin:0 0 22px;opacity:.75}
      .nf nav{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
      .nf nav a{padding:12px 18px;border-radius:12px;background:rgba(255,255,255,.08);color:#fff;font-weight:700}
      .nf nav a.c{background:var(--coral,#ff6b5b)}
    </style>
  </head>
  <body>
    <main class="nf">
      <img src="/images/logo.svg" alt="იმერეთი ტური" width="56" height="56">
      <b>404</b>
      <h1>გვერდი ვერ მოიძებნა</h1>
      <p>Страница не найдена · Page not found</p>
      <nav>
        <a class="c" href="/">მთავარი</a>
        <a href="/schedule/">განრიგი</a>
        <a href="/ru/">Русский</a>
        <a href="/en/">English</a>
        <a href="https://wa.me/995598808022">WhatsApp</a>
      </nav>
    </main>
  </body>
</html>
